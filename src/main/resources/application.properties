# ==============================================================================
# ATHENAEUM LIBRARY MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION
# ==============================================================================

server.port=8080
spring.application.name=library-management-system

# ------------------------------------------------------------------------------
# DEFAULT PROFILE: In-Memory H2 Database (Instant Testing with Zero Prerequisites)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate Schema Auto-generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

